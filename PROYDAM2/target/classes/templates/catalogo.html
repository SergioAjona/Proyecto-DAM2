<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="/css/styles.css"/>
    <title>Baick</title>
</head>

<body>
<header>
    <img src="/imgs/logo_grande_final.png" alt="logo"/>

    <nav class="menu">
        <ul>
            <li class="current-menu-item"><a href="/">Inicio</a></li>
            <li class="current-menu-item"><a href="catalogo">Catálogo</a>
                <ul>
                    <li><a href="catalogo">Bicicletas</a>
                        <ul>
                            <li><a href="catalogo">Carretera</a></li>
                            <li><a href="catalogo">Montaña</a></li>
                            <li><a href="catalogo">Gravel</a></li>
                            <li><a href="catalogo">Ciclocross</a></li>
                            <li><a href="catalogo">BMX</a></li>
                        </ul>
                    </li>
                    <li><a href="catalogo">Niños</a>
                        <ul>
                            <li><a href="catalogo">Junior</a></li>
                        </ul>
                    </li>
                </ul>
            </li>
            <li class="current-menu-item"><a href="acercade.html">Acerca de</a></li>
            <li class="current-menu-item"><a href="soporte.html">Contacto</a></li>

            <div class="auth-links">
                <button id="abrirLogin">Iniciar Sesión</button>
                <button id="abrirRegistro">Registrarse</button>
                <button id="cerrarSesion" style="display: none;">Cerrar Sesión</button>
            </div>
        </ul>
    </nav>

    <!-- Modal de Login -->
    <div id="modalLogin" class="modal">
        <div class="modal-contenido">
            <span class="cerrar" id="cerrarLogin">&times;</span>
            <h2>Iniciar Sesión</h2>
            <form id="formLogin">
                <input type="email" id="emailLogin" placeholder="Correo electrónico" required />
                <input type="password" id="contrasenaLogin" placeholder="Contraseña" required />
                <button type="submit">Iniciar sesión</button>
            </form>
        </div>
    </div>

    <!-- Modal de Registro -->
    <div id="modalRegistro" class="modal">
        <div class="modal-contenido">
            <span class="cerrar" id="cerrarRegistro">&times;</span>
            <h2>Registrarse</h2>
            <form id="formRegistro">
                <input type="text" id="nombre" placeholder="Nombre completo" required>
                <input type="text" id="apellido" placeholder="Apellido" required>
                <input type="email" id="email" placeholder="Correo electrónico" required>
                <input type="password" id="contrasena" placeholder="Contraseña" required>
                <input type="text" id="dni" placeholder="DNI" required>
                <input type="number" id="telefono" placeholder="Telefono" required>
                <input type="text" id="ciudad" placeholder="Ciudad" required>
                <button type="submit">Registrarse</button>
            </form>
        </div>
    </div>


    <div class="container-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
             class="icon-cart">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z"/>
        </svg>

        <div class="count-products">
            <span id="contador-productos">0</span>
        </div>

        <div class="container-cart-products hidden-cart">
            <div class="cart-product">
                <div class="info-cart-product">
                    <span class="cantidad-producto-carrito">1</span>
                    <p class="titulo-producto-carrito">producto</p>
                    <span class="precio-producto-carrito">80€</span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                         stroke="currentColor" class="icon-close">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
                    </svg>

                </div>
            </div>
            <div class="cart-total">
                <h3>Total:</h3>
                <span class="total-pagar">100€</span>
            </div>
        </div>
    </div>
</header>

<div class="container-items">
    <div th:each="bicicleta : ${bicicletas}" class="container-item">
        <div class="item">
            <figure>
                <img th:src="${bicicleta.imagen}"/>
            </figure>
            <div class="info-product">
                <h2 th:text="${bicicleta.marca}">Marca</h2>
                <h3 th:text="${bicicleta.modelo}">Modelo</h3>
                <p class="precio" th:text="${bicicleta.precio + '€'}">Precio</p>
                <button>Ver</button>
            </div>
        </div>
    </div>
</div>
<script src="/js/script.js"></script>
</body>

</html>
