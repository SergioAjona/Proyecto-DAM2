<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Finalizar Compra</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="/css/styles.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
  <title>Baick</title>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="mensajeConf">
  <div th:if="${error}">
    <p th:text="${error}" style="color: red;"></p>
  </div>
</div>

<div class="container">
  <h1>Finalizar Compra</h1>

  <h2>Tu carrito</h2>
  <div th:each="bicicleta : ${carrito}" class="section cart">
    <div class="cart-item">
      <span th:text="${bicicleta.marca} + ' ' + ${bicicleta.modelo}"></span>
      <p><span th:text="${bicicleta.precio}"></span>€</p>
    </div>
  </div>

  <div class="section summary">
    <h2>Resumen del pedido</h2>
    <p><strong>Total: <span th:text="${total}"></span> €</strong></p>
  </div>

  <div class="section formularioPago">
    <h2>Datos de pago</h2>
    <form th:action="@{/pago/confirmar}" method="post">
      <label for="name">Nombre completo</label>
      <input type="text" id="name" name="name" th:value="${usuarioNombre}" required>

      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" th:value="${usuarioEmail}" required>

      <label for="entrega">Dirección de entrega</label>
      <input type="text" id="entrega" name="entrega" required>

      <label for="card">Número de tarjeta</label>
      <input type="text" id="card" name="card" placeholder="1234 5678 9012 3456" pattern="\d{4} \d{4} \d{4} \d{4}" required>

      <label for="exp">Fecha de expiración</label>
      <input type="text" id="exp" name="exp" placeholder="MM/AA" pattern="\d{2}/\d{2}" required>

      <label for="cvv">CVV</label>
      <input type="number" id="cvv" name="cvv" required pattern="\d{3}">

      <button type="submit" class="btn">REALIZAR PAGO <span th:text="${total}"></span>€</button>
    </form>
  </div>
</div>

</body>
</html>
