<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <title>Baick</title>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div id="myModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <p>¡Su mensaje ha sido enviado al soporte, le rogamos esté atento a su correo asociado a la cuenta para la respuesta!</p>
    </div>
</div>

<div class="titulo-contacto">
    <h2>SOPORTE</h2>
</div>

<div class="formulario">
    <form th:action="@{/soporte/enviar}" method="post" th:object="${mensaje}">
        <ul>
            <li>
                <label for="tipo">Asunto a tratar:</label>
                <select type="text" id="tipo" name="tipo" class="selector">
                    <option value="0">Problema o incidencia con el funcionamiento de la página o pago</option>
                    <option value="1">Duda o pregunta sobre las funcionalidades de la página o trámites</option>
                    <option value="2">Sugerencias y propuestas para la mejora en el funcionamiento de la página</option>
                </select>
            </li>
            <li>
                <label for="msg">Describe tu problema:</label>
                <textarea id="msg" name="msg"></textarea>
            </li>
        </ul>
        <button type="submit">Enviar</button>
    </form>

</div>

</body>

</html>
