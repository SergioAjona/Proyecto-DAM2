<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <title>Baick</title>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="titulo-contacto">
    <h2>SOPORTE</h2>
</div>

<div th:if="${enviado}">
    <p style="color: green;">Tu mensaje ha sido enviado correctamente. Te responderemos lo antes posible al correo electrónico vinculado a tu cuenta.</p>
</div>

<div th:if="${error}">
    <p style="color: red;">Hubo un error al enviar tu mensaje. Intenta nuevamente.</p>
</div>

<div class="formulario">
    <form th:action="@{/soporte/enviar}" method="post">
      <div>
        <label for="asunto">Asunto a tratar:</label>
        <select type="text" id="asunto" name="asunto" class="selector">
            <option value="Problema o incidencia con el funcionamiento de la página o pago">
                Problema o incidencia con el funcionamiento de la página o pago
            </option>
            <option value="Duda o pregunta sobre las funcionalidades de la página o trámites">
                        Duda o pregunta sobre las funcionalidades de la página o trámites
            </option>
            <option value="Sugerencias y propuestas para la mejora en el funcionamiento de la página">
                Sugerencias y propuestas para la mejora en el funcionamiento de la página
            </option>
        </select>
      </div>
      <div>
        <label for="contenido">Describe tu problema:</label>
        <textarea id="contenido" name="contenido" required></textarea>
      </div>
        <button type="submit">Enviar</button>
    </form>

    <a href="/" style="display: block; margin-top: 30px;">Volver al inicio</a>

</div>
<div class="enlace">
  <a href="/admin/mensajes" th:if="${admin}">Administrar Mensajes</a>
</div>

</body>

</html>
