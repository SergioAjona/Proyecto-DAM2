<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <title>Baick</title>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="titulo-contacto">
    <h2>CARRO</h2>
</div>

<div class="formulario">
    <table>
        <thead>
        <tr>
            <th>Imagen</th>
            <th>Marca</th>
            <th>Modelo</th>
            <th>Precio</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${carrito}">
            <td><img th:src="${item.imagen}" alt="Producto" width="100"/></td>
            <td th:text="${item.marca}">Marca</td>
            <td th:text="${item.modelo}">Modelo</td>
            <td th:text="${item.precio} + ' €'">Precio</td>
            <td>
                <form th:action="@{/carrito/eliminar}" method="post">
                    <input type="hidden" name="productoId" th:value="${item.id}" />
                    <button type="submit">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <form th:action="@{/pago}" method="get">
        <button>Confirmar</button>
    </form>


</div>

</body>

</html>
