<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="/css/styles.css"/>
  <title>Baick</title>
  <style>
    .header {
        text-align: center;
        margin-bottom: 30px;
    }

    .logo {
        width: 150px;
    }

    .user-info {
        margin-bottom: 20px;
    }

    .user-info p {
        margin: 2px 0;
    }

    h1 {
        text-align: center;
        font-size: 20px;
        margin-bottom: 10px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    th, td {
        border: 1px solid #444;
        padding: 8px;
        text-align: left;
    }

    th {
        background-color: #f0f0f0;
    }

    .total {
        text-align: right;
        margin-top: 20px;
        font-weight: bold;
    }

    .footer {
        margin-top: 40px;
        text-align: center;
        font-size: 10px;
        color: #777;
    }
  </style>
</head>
<body>

<div class="header">
  <img src="file:src/main/resources/static/imgs/logo_grande_final.png" class="logo" alt="Logo" />
</div>

<h1>Factura de Compra</h1>

<div class="user-info">
  <p><strong>Nombre del Usuario:</strong> <span th:text="${nombre} + ' ' + ${apellido}">Nombre</span></p>
  <p><strong>Fecha:</strong> <span th:text="${#dates.format(#dates.createNow(), 'dd/MM/yyyy')}"></span></p>
</div>

<table>
  <thead>
  <tr>
    <th>Producto</th>
    <th>Precio (€)</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="item : ${carrito}">
    <td th:text="${item.marca} + ' ' + ${item.modelo}">Producto</td>
    <td th:text="${item.precio}">0.00</td>
  </tr>
  </tbody>
</table>

<p class="total">
  Total: <span th:text="${#numbers.formatDecimal(total, 1, 2)} + ' €'">0.00 €</span>
</p>

<div class="footer">
  Gracias por tu compra - Tienda Bicicletas Baick - Baick® 2025
</div>

</body>
</html>
