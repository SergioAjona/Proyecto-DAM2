<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <title>Baick</title>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<h1 class="titulo-contacto">Mensajes de Soporte</h1>

<div class="titulo-contacto" th:if="${#lists.isEmpty(mensajes)}">
    <p>No hay mensajes pendientes.</p>
</div>

<div class="formulario" th:each="mensaje : ${mensajes}" style="border: 1px solid #ccc; padding: 15px; margin-bottom: 20px;">
    <p><strong>De:</strong> <span th:text="${mensaje.usuarioEmail}"></span></p>
    <p><strong>Asunto:</strong> <span th:text="${mensaje.asunto}"></span></p>
    <p><strong>Mensaje:</strong></p>
    <p th:text="${mensaje.contenido}"></p>

    <form th:action="@{/admin/mensajes/responder}" method="post" style="margin-top: 15px;">
        <input type="hidden" name="mensajeId" th:value="${mensaje.id}" />
        <label>Respuesta:</label><br>
        <textarea name="responseText" rows="4" cols="60" required></textarea><br><br>
        <button type="submit">Enviar respuesta</button>
    </form>
</div>

</body>

</html>
