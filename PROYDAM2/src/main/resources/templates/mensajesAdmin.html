<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <title>Baick</title>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<h2>Mensajes de soporte</h2>
<table>
    <tr>
        <th>Email</th>
        <th>Mensaje</th>
        <th>Tipo</th>
        <th>Respuesta</th>
    </tr>
    <tr th:each="msg : ${mensajes}">
        <td th:text="${msg.email}"></td>
        <td th:text="${msg.message}"></td>
        <td th:text="${msg.tipo}"></td>
        <td>
            <form th:action="@{'/soporte/admin/responder/' + ${msg.id}}" method="post">
                <textarea name="respuesta" th:text="${msg.respuestaAdmin}"></textarea>
                <button type="submit">Responder</button>
            </form>
        </td>
    </tr>
</table>

</body>

</html>
