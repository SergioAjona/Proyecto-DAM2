<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <title>Baick</title>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="titulo-contacto">
    <h2>REGISTRO</h2>
</div>

<div class="formulario">
    <form th:action="@{/registro}" th:object="${Usuario}" method="post">
      <div>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" th:field="*{nombre}" />
      </div>
          
      <div>
        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" th:field="*{apellido}" />
      </div>
          
      <div>
        <label for="email">Correo electrónico:</label>
        <input type="text" id="email" th:field="*{email}" required/>
      </div>
          
      <div>
        <label for="contraseña">Contraseña:</label>
        <input type="password" id="contraseña" th:field="*{contrasena}" required/>
      </div>
          
      <div>
        <label for="ciudad">Ciudad:</label>
        <input type="text" id="ciudad" th:field="*{ciudad}" />
      </div>
          
      <div>
        <label for="dni">DNI:</label>
        <input type="text" id="dni" th:field="*{dni}" />
      </div>
          
      <div>
        <label for="telefono">Teléfono:</label>
        <input type="number" id="telefono" th:field="*{telefono}" />
      </div>
          
        <button type="submit">REGISTRARSE</button>
    </form>

    <div th:if="${error}">
        <p th:text="${error}" style="color: red;"></p>
    </div>

</div>

</body>

</html>
